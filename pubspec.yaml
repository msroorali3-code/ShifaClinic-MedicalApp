name: shifa_clinic_app
description: Medical Consultation App for Shifa Clinic Centre

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.0
  google_maps_flutter: ^2.2.0
  
  # Firebase
  firebase_core: ^2.10.0
  firebase_auth: ^4.2.0
  cloud_firestore: ^4.3.0
  firebase_storage: ^11.0.0
  firebase_messaging: ^14.0.0
  
  # Payment
  razorpay_flutter: ^1.3.2
  upi_india: ^2.0.0
  
  # Video/Chat
  agora_rtc_engine: ^6.0.0
  agora_uikit: ^1.2.0
  
  # Location
  geolocator: ^9.0.0
  
  # State Management
  provider: ^6.0.0
  get: ^4.6.0
  
  # API & HTTP
  http: ^1.1.0
  dio: ^5.0.0
  
  # Database
  sqflite: ^2.2.0
  path: ^1.8.0
  
  # Utilities
  intl: ^0.18.0
  shared_preferences: ^2.1.0
  connectivity_plus: ^4.0.0
  url_launcher: ^6.1.0
  image_picker: ^0.8.7
  camera: ^0.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
